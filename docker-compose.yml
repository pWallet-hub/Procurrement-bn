# Backend stack: API + worker + PostgreSQL + Redis + SeaweedFS (S3 files) + Mailpit (dev mail catcher).
# Runs on its own: `docker compose up -d --build` in this folder.
# Start:  docker compose up --build        API: http://localhost:3000/api/v1/health
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: afs
      POSTGRES_PASSWORD: afs_dev_password
      POSTGRES_DB: afs
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]   # dev only; remove in production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U afs -d afs"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3 compatible object store (SeaweedFS, Apache-2.0, actively maintained). Replaces MinIO.
  storage:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-dir=/data", "-filer", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    volumes:
      - storagedata:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro   # dev credentials; use your own keys in production
    ports: ["127.0.0.1:${S3_PORT:-8333}:8333"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:latest
    ports: ["127.0.0.1:${MAILPIT_PORT:-8025}:8025"]   # inbox UI; SMTP on 1025 inside the network

  api:
    build: .
    env_file: [.env]
    environment:
      ROLE: api
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_healthy }
    ports: ["${API_PORT:-3000}:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build: .
    command: ["node", "dist/worker.js"]
    env_file: [.env]
    depends_on:
      api: { condition: service_healthy }   # api runs migrations first

volumes:
  pgdata:
  redisdata:
  storagedata:
